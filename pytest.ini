[pytest]
asyncio_mode = auto
# The tests live in tests/. The integration's own hardware_test.py matches *_test.py and has a function
# named test_runner_for; collected, it imports the package a second time as the top-level `spotnav`
# (custom_components has no __init__.py) and breaks every config-flow test that runs after it.
testpaths = tests
addopts = --ignore=custom_components
# A test that runs longer than a minute is stuck: fail it rather than let it run on.
timeout = 60
markers =
    first_run_defaults: run the real first-run defaults when a charger is set up (off by default in tests)
    installation_questions: ask a new charger's phases and voltage between phases in the flow (off by default in tests)
    history_import: let a charger's setup schedule the background import of earlier charges (off by default in tests)
    blueprint_install: let the integration's setup install its blueprints (off by default in tests)
    core_failure_expected: a test about a decision the charge-ownership core could not take, provoked on purpose
    allow_loop_io: the test reads or writes a file on the event loop on purpose (the loop I/O guard lets it)
