[pytest]
asyncio_mode = auto
markers =
    first_run_defaults: run the real first-run defaults when a charger is set up (off by default in tests)
    installation_questions: ask a new charger's phases and voltage between phases in the flow (off by default in tests)
    history_import: let a charger's setup schedule the background import of earlier charges (off by default in tests)
    shadow_disagreement_expected: a test about the ownership shadow itself, which provokes a disagreement on purpose
