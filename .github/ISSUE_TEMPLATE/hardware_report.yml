name: "Hardware tested: tell us what you use SpotNav with"
description: A compatibility report for the supported list (works or not). For a bug, use Bug instead.
title: "Hardware: "
labels: ["hardware-report"]
body:
  - type: markdown
    attributes:
      value: |
        The supported hardware list (`docs/supported.md` in this repository) marks a row as Tested only when it is
        confirmed on real hardware. A report here moves rows from "Detected from the integration's source" to
        Tested, or shows what to fix. Something behaving wrongly? Use the **Bug** form instead.
        Do not paste addresses, webhook ids or tokens.
  - type: textarea
    id: hardware
    attributes:
      label: Your hardware
      description: |
        One line per device: what it is, make and model, the Home Assistant integration (its domain), and whether
        it works with SpotNav. List everything you use with it: chargers, cars, grid meter, battery, solar forecast.
      placeholder: |
        Charger: Charge Amps HALO (ocpp) — works: start/stop, current, energy meter
        Car: Kia EV6 (kia_uvo) — works, charge level every 30 min
        Grid meter: Tibber Pulse (tibber) — works
        Battery: Sigenergy (sigen) — power read fine
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: SpotNav and Home Assistant versions
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Anything to note (optional)
      description: For a device that did not work, or only partly, what you saw. For a charger, say which of start and stop, current control and the energy meter worked.
