name: Works with my hardware, or does not
description: Tell us how SpotNav behaves with your charger, meter, battery, solar forecast or car.
title: "Hardware: "
labels: ["hardware-report"]
body:
  - type: markdown
    attributes:
      value: |
        The supported hardware list (`docs/supported.md` in this repository) marks a row as Tested only when it is confirmed on real hardware. A report here moves a row
        from "Detected from the integration's source" to Tested, or shows what to fix.
        Do not paste addresses, webhook ids or tokens.
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works with my hardware
        - Does not work with my hardware
        - Works, with something to note
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of hardware
      options:
        - EV charger
        - Grid meter
        - House battery
        - Solar forecast
        - Car
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Make and model
      placeholder: "Example: Charge Amps HALO"
    validations:
      required: true
  - type: input
    id: integration
    attributes:
      label: Home Assistant integration and its domain
      placeholder: "Example: ocpp"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: SpotNav and Home Assistant versions
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What happened
      description: What you did, what you expected and what SpotNav did instead. For a charger, say which of start and stop, current control and the energy meter worked.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional)
      description: Attach the file from Settings, Devices & services, SpotNav, the entry's menu, Download diagnostics. It is safe to attach publicly.
