name: Upstream drift

# Weekly: do the entity keys, states and services SpotNav relies on still exist in the integrations it drives?
# Reads public sources only (shallow clones), needs no secret and writes nothing. A red run is the report; open it,
# read the integration's change log, decide. No issue is opened by itself.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/upstream_drift/**"
      - "tools/upstream_drift_canary.py"
      - ".github/workflows/upstream-drift.yml"

permissions:
  contents: read

jobs:
  canary:
    name: Canary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - name: Check the upstream sources
        run: python tools/upstream_drift_canary.py --cache "$RUNNER_TEMP/upstream"
