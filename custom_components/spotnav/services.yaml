dismiss_vehicle:
  name: Dismiss a detected vehicle
  description: >
    Stop reporting one vehicle-like Home Assistant device in the vehicle
    list, until it is undismissed. Useful when automatic detection
    picks up a device that is not the car you charge. Administrators only.
  fields:
    device_id:
      name: Device ID
      description: >
        The Home Assistant device ID of the vehicle to dismiss. It does not
        have to exist right now: dismissing an id ahead of the device
        appearing still applies once it does.
      required: true
      example: 8f14e45fceea167a5a36dedd4bea2543
      selector:
        text:

undismiss_vehicle:
  name: Undismiss a detected vehicle
  description: >
    Undo dismiss_vehicle for one device ID, so automatic detection reports it
    again. Administrators only.
  fields:
    device_id:
      name: Device ID
      description: The Home Assistant device ID to report again.
      required: true
      example: 8f14e45fceea167a5a36dedd4bea2543
      selector:
        text:

unconfirm_vehicle:
  name: Unconfirm a detected vehicle's state of charge
  description: >
    Forget which state-of-charge entity was confirmed for one device ID, so the
    device goes back to being an ambiguity to resolve (or to being detected
    automatically, if only one plausible reading is left). Useful when the
    wrong reading was picked. A confirmation that names an entity which no
    longer exists is already ignored without this, and dismissing a vehicle is
    a separate decision this never touches. Administrators only.
  fields:
    device_id:
      name: Device ID
      description: >
        The Home Assistant device ID to unconfirm. An id with no confirmation
        is not an error: there is simply nothing to forget.
      required: true
      example: 8f14e45fceea167a5a36dedd4bea2543
      selector:
        text:

confirm_vehicle_soc:
  name: Confirm a detected vehicle's state of charge
  description: >
    Choose which of a vehicle device's battery sensors is its state of
    charge, when detection found more than one plausible reading. The same
    choice as the repair under Settings, System, Repairs and the card's
    vehicle settings. An entity that is not one of the device's candidates
    records nothing and is logged once. Undo with unconfirm_vehicle.
    Administrators only.
  fields:
    device_id:
      name: Device ID
      description: The Home Assistant device ID of the vehicle.
      required: true
      example: 8f14e45fceea167a5a36dedd4bea2543
      selector:
        text:
    entity_id:
      name: Entity ID
      description: >
        The state-of-charge sensor to use, one of the device's current
        candidates.
      required: true
      example: sensor.my_car_battery_level
      selector:
        text:

confirm_charge_limit:
  name: Confirm a detected vehicle's charge limit
  description: >
    Choose which of a vehicle device's charge-limit entities SpotNav writes
    to, when the device has more than one (for example one for AC and one
    for DC charging). A vehicle with a single charge limit needs none of
    this. An entity that is not one of the device's charge limits records
    nothing and is logged once. Undo with unconfirm_charge_limit.
    Administrators only.
  fields:
    device_id:
      name: Device ID
      description: The Home Assistant device ID of the vehicle.
      required: true
      example: 8f14e45fceea167a5a36dedd4bea2543
      selector:
        text:
    entity_id:
      name: Entity ID
      description: The charge-limit entity to write to, one of the device's own.
      required: true
      example: number.my_car_charge_limit_ac
      selector:
        text:

unconfirm_charge_limit:
  name: Unconfirm a detected vehicle's charge limit
  description: >
    Forget which charge-limit entity was confirmed for one device ID, so the
    choice goes back to being an ambiguity to resolve. The state-of-charge
    confirmation and a dismissal are separate decisions this never touches.
    Administrators only.
  fields:
    device_id:
      name: Device ID
      description: >
        The Home Assistant device ID to unconfirm. An id with no confirmation
        is not an error: there is simply nothing to forget.
      required: true
      example: 8f14e45fceea167a5a36dedd4bea2543
      selector:
        text:

send_test_notification:
  name: Send a test notification
  description: >
    For a field test without unplugging the car. Sends the SpotNav app a test
    push through the SpotNav relay for every charger the app turned instant
    notifications on for, and a test message to the Companion app phones
    chosen for that charger's notifications. Refused when no charger has the
    app's instant notifications turned on. The result per charger is logged
    and returned. Administrators only.
  fields:
    charger:
      name: Charger
      description: >
        The charger's config entry ID, or the entity ID of one of its entities.
        Leave out for every charger.
      required: false
      example: 01J9ZQ2X3V4W5Y6Z7A8B9C0D1E
      selector:
        text:

get_prices:
  name: Get electricity prices
  description: >
    Answer with the prices of one SpotNav electricity price: each interval's
    start and end, its price with your fees and VAT and its spot price, in the
    area's currency per kWh. Defaults to today, and tomorrow once published.
    Reads only what Home Assistant already holds and changes nothing, so every
    user may call it.
  fields:
    config_entry_id:
      name: Electricity price
      description: >
        The electricity price entry to read. Leave it out when there is only
        one.
      required: false
      selector:
        config_entry:
          integration: spotnav
    device_id:
      name: Device
      description: The electricity price's device, instead of the entry.
      required: false
      selector:
        device:
          integration: spotnav
    start:
      name: Start
      description: >
        The first interval to include (default: the start of today in the
        price area).
      required: false
      selector:
        datetime:
    end:
      name: End
      description: >
        Where to stop (default: the end of tomorrow when its prices are
        published, else the end of today).
      required: false
      selector:
        datetime:

export_day:
  name: Export a day's records
  description: >
    Write one site's day as SpotNav decided and measured it to a JSON file in
    the configuration folder, spotnav_archive/<site id>/<date>.json: the
    forecasts with their outcomes, the prices, the battery plan's quarter
    hours and review, the house's hours, the settings and the shadow logs.
    A day already written is overwritten. SpotNav keeps these records for a
    limited time (the quarter hours for three days, the forecasts for 14), so
    call it every night to keep them; an older day exports what is left and
    names what is missing. Answers with the file's path and counts.
    Administrators only.
  fields:
    site:
      name: Site
      description: >
        The site to export. Leave it out when there is only one.
      required: false
      selector:
        config_entry:
          integration: spotnav
    date:
      name: Date
      description: >
        The local day to export (default: yesterday).
      required: false
      selector:
        date:

battery_control_test:
  name: Test the home battery control (owner)
  description: >
    For the owner's on-site tests only: run one action through SpotNav's
    battery control, with every safety rule, for some minutes, then hand the
    battery back. Refused unless the site's battery control is turned on;
    while the site is shadow only or the battery check has not passed, only
    with Force test. Administrators only.
  fields:
    site:
      name: Site
      description: >
        The site. Leave it out when there is only one.
      required: false
      selector:
        config_entry:
          integration: spotnav
    action:
      name: Action
      description: >
        hold, grid_charge, discharge_house, export_discharge, curtail_export,
        or stop to end a running test.
      required: true
      selector:
        select:
          options:
            - hold
            - grid_charge
            - discharge_house
            - export_discharge
            - curtail_export
            - stop
    power:
      name: Power
      description: >
        kW for grid_charge and export_discharge (default 2).
      required: false
      selector:
        number:
          min: 0.1
          max: 100
          step: 0.1
          unit_of_measurement: kW
    minutes:
      name: Minutes
      description: >
        How long the action runs before it is handed back (default 15, at
        most 120).
      required: false
      default: 15
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: min
    force_test:
      name: Force test
      description: >
        Run even while the site is shadow only or before the battery check
        passed (on-site tests). Battery control must still be turned on.
      required: false
      default: false
      selector:
        boolean:

battery_control_settings:
  name: Home battery control settings (owner)
  description: >
    For the owner's on-site tests until the card has the switch: write the
    site's battery control options. Turning control off hands the battery
    back first. Administrators only.
  fields:
    site:
      name: Site
      description: >
        The site. Leave it out when there is only one.
      required: false
      selector:
        config_entry:
          integration: spotnav
    battery_control_enabled:
      name: Control on
      description: >
        Let SpotNav run the battery once its check passed.
      required: false
      selector:
        boolean:
    battery_control_shadow_only:
      name: Shadow only
      description: >
        Write nothing, only log what would be done (on by default).
      required: false
      selector:
        boolean:
    battery_control_ai_takeover_ack:
      name: AI mode takeover read
      description: >
        The person read that SpotNav takes the plant over from Sigenergy's AI
        mode.
      required: false
      selector:
        boolean:
    battery_mode:
      name: Battery mode
      description: >
        What the battery is for. Balanced sells to the grid only when it is highly profitable, Max profit whenever it pays.
      required: false
      selector:
        select:
          options:
            - self_consumption
            - balanced
            - max_profit
    battery_control_import_limit_acts:
      name: Import limit acts
      description: >
        The on-site test showed that the plant's import limit acts under
        Remote EMS.
      required: false
      selector:
        boolean:
    battery_control_accept_ha_down:
      name: Home Assistant down accepted
      description: >
        The person accepts that a fuse may trip if Home Assistant stops, or
        loses contact with the battery or the grid meter, during a grid charge
        of the home battery; the charge is then capped at what the fuse allows
        with an empty house.
      required: false
      selector:
        boolean:
    export_curtail_enabled:
      name: No export at negative prices
      description: >
        Set the site's export limit to zero while a sold kWh earns less than
        nothing, and put it back afterwards. For a site with or without a
        battery; the battery control switch does not turn it on.
      required: false
      selector:
        boolean:

show_year_review:
  name: Show the year's review
  description: >
    Work out a site's "Year with SpotNav" now and offer it in the house and
    charger cards for seven days, whatever the date: the banner and the row
    under Settings, Support. Answers with the review's figures, so a new
    installation can see them here. Administrators only.
  fields:
    site:
      name: Site
      description: >
        The site. Leave it out when there is only one.
      required: false
      selector:
        config_entry:
          integration: spotnav
    year:
      name: Year
      description: >
        The year to review (default: this year in December, last year in
        January, else the year so far).
      required: false
      selector:
        number:
          min: 2020
          max: 2100
          mode: box
    reset:
      name: Show the banner again
      description: >
        Show the banner again to everyone who opened or closed it (on by
        default).
      required: false
      default: true
      selector:
        boolean:
