<!doctype html>
<!-- The README banner and GitHub social preview, 1280×640: assets/spotnav-social-preview.png.
     Rendered by tools/social/render.sh, which says where the pictures in it come from. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>SpotNav banner</title>
<link rel="stylesheet" href="social.css">
<style>
  body { width: 1280px; height: 640px; }
  .text { position: absolute; left: 88px; top: 66px; width: 470px; }
  .icon { width: 128px; height: 128px; border-radius: 30px; box-shadow: 0 18px 40px rgba(0, 0, 0, .55); display: block; }
  h1 { margin: 24px 0 0; font-size: 92px; line-height: 1; font-weight: 700; letter-spacing: -1px; color: #f5f7fa; }
  h2 { margin: 4px 0 0; font-size: 44px; line-height: 1.15; font-weight: 700; color: #e3e8ee; }
  p { margin: 14px 0 0; font-size: 32px; line-height: 1.3; color: #aab4bf; }
  p.line { margin-top: 12px; font-size: 22px; line-height: 1.3; color: #8b96a2; }
  .rule { margin-top: 22px; width: 150px; height: 6px; border-radius: 3px; background: #4fb3f6; }
  .c { position: absolute; border-radius: 12px; box-shadow: 0 22px 50px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06); }
  .c0 { left: 458px; top: 52px; width: 236px; }
  .c1 { left: 690px; top: 30px; width: 280px; }
  .c2 { left: 556px; top: 248px; width: 370px; }
  .text { z-index: 2; text-shadow: 0 2px 18px rgba(13, 16, 20, .9); }
  .phone { position: absolute; left: 986px; top: 74px; width: 240px; }
</style>
</head>
<body>
  <div class="glow one"></div><div class="glow two"></div>
  <div class="text">
    <img class="icon" src="../../assets/spotnav-icon.svg" alt="">
    <h1>SpotNav</h1>
    <h2>for Home Assistant</h2>
    <p>Learns your home.<br>Plans your energy.</p>
    <p class="line">EV, battery, heating and solar<br>on spot prices</p>
    <div class="rule"></div>
  </div>
  <img class="c c0" src="card-dark-flow.png" alt="">
  <img class="c c1" src="card-dark-earn.png" alt="">
  <img class="c c2" src="card-dark-now.png" alt="">
  <div class="phone frame"><img src="app-main.png" alt=""></div>
</body>
</html>
