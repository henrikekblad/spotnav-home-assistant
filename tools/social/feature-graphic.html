<!doctype html>
<!-- The Google Play feature graphic, 1024×500: fastlane/metadata/android/en-US/images/featureGraphic.png in the
     app repository. Rendered by tools/social/render.sh, which says where the pictures in it come from. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>SpotNav feature graphic</title>
<link rel="stylesheet" href="social.css">
<style>
  body { width: 1024px; height: 500px; }
  .text { position: absolute; left: 64px; top: 72px; width: 400px; }
  .icon { width: 96px; height: 96px; border-radius: 23px; box-shadow: 0 14px 32px rgba(0, 0, 0, .55); display: block; }
  h1 { margin: 24px 0 0; font-size: 74px; line-height: 1; font-weight: 700; letter-spacing: -1px; color: #f5f7fa; }
  p { margin: 16px 0 0; font-size: 30px; line-height: 1.25; color: #c3cbd4; }
  p.line { margin-top: 14px; font-size: 20px; line-height: 1.3; color: #8b96a2; }
  .rule { margin-top: 22px; width: 120px; height: 5px; border-radius: 3px; background: #4fb3f6; }
  .card { position: absolute; left: 470px; top: 118px; width: 310px; }
  .phone { position: absolute; left: 800px; top: 40px; width: 188px; }
</style>
</head>
<body>
  <div class="glow one"></div><div class="glow two"></div>
  <div class="text">
    <img class="icon" src="../../assets/spotnav-icon.svg" alt="">
    <h1>SpotNav</h1>
    <p>Learns your home.<br>Plans your energy.</p>
    <p class="line">EV, battery, heating and solar<br>on spot prices</p>
    <div class="rule"></div>
  </div>
  <img class="card shot" src="card-light.png" alt="">
  <div class="phone frame"><img src="app-main.png" alt=""></div>
</body>
</html>
